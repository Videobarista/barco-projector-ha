name: Ruff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Run Ruff directly instead of through an action: the action still ships a
      # Node 20 entrypoint, and a pinned version keeps the badge stable when new
      # rules are released.
      - name: Run Ruff
        run: pipx run ruff==0.16.8 check --output-format github .
